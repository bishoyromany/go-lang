        <h1>GoTutor - The Complete Go Programming Tutorial</h1>
        <p>Learn Go (Golang) from beginner to advanced with 25 in-depth lessons covering concurrency, goroutines, channels, interfaces, generics, testing, databases, design patterns, and production deployment.</p>

        <h2>Foundations</h2>
        <ul>
          <li><a href="/lesson/introduction-to-go">Introduction to Go</a> - Learn why Go was created, its key strengths, philosophy, and how to set up your first Go development environment.</li>
          <li><a href="/lesson/variables-types-constants">Variables, Types &amp; Constants</a> - Master Go's type system including variable declarations, zero values, basic types, and iota.</li>
          <li><a href="/lesson/control-flow">Control Flow</a> - Learn Go control flow: if/else, for loops, switch statements, defer, panic, and recover.</li>
          <li><a href="/lesson/functions-closures">Functions &amp; Closures</a> - Deep dive into Go functions: multiple return values, variadic functions, closures, and method receivers.</li>
        </ul>

        <h2>Data Structures</h2>
        <ul>
          <li><a href="/lesson/arrays-slices">Arrays &amp; Slices</a> - Understand Go arrays vs slices, slice internals, append, copy, and common manipulation patterns.</li>
          <li><a href="/lesson/maps">Maps</a> - Master Go maps: creation, operations, iteration, nil map gotchas, and common patterns.</li>
          <li><a href="/lesson/structs-methods">Structs &amp; Methods</a> - Learn Go structs: embedding, struct tags, constructor patterns, and functional options.</li>
        </ul>

        <h2>Interfaces &amp; Generics</h2>
        <ul>
          <li><a href="/lesson/interfaces">Interfaces</a> - Understand Go interfaces: implicit satisfaction, type assertions, and key stdlib interfaces.</li>
          <li><a href="/lesson/generics">Generics</a> - Master Go generics (1.18+): type parameters, constraints, and generic utility functions.</li>
        </ul>

        <h2>Concurrency</h2>
        <ul>
          <li><a href="/lesson/goroutines">Goroutines</a> - Learn Go goroutines: lightweight threads, WaitGroups, fan-out, and worker pool patterns.</li>
          <li><a href="/lesson/channels">Channels</a> - Master Go channels: buffered vs unbuffered, select statements, pipelines, and semaphores.</li>
          <li><a href="/lesson/sync-primitives-context">Sync Primitives &amp; Context</a> - Learn Mutex, RWMutex, sync.Once, sync.Map, and the context package.</li>
        </ul>

        <h2>Error Handling</h2>
        <ul>
          <li><a href="/lesson/error-handling-patterns">Error Handling Patterns</a> - Master Go error handling: custom errors, wrapping, sentinel errors, and production patterns.</li>
        </ul>

        <h2>Packages &amp; Modules</h2>
        <ul>
          <li><a href="/lesson/packages-modules-visibility">Packages, Modules &amp; Visibility</a> - Understand Go packages, modules, visibility rules, and project layout.</li>
        </ul>

        <h2>Standard Library</h2>
        <ul>
          <li><a href="/lesson/working-with-json">Working with JSON</a> - Learn Go JSON encoding/decoding, struct tags, dynamic JSON, and streaming.</li>
          <li><a href="/lesson/http-servers-clients">HTTP Servers &amp; Clients</a> - Build Go HTTP servers with routing, middleware, and graceful shutdown.</li>
          <li><a href="/lesson/file-io-os">File I/O &amp; OS</a> - Master Go file I/O, filepath operations, and OS operations.</li>
        </ul>

        <h2>Testing</h2>
        <ul>
          <li><a href="/lesson/unit-testing-benchmarks">Unit Testing &amp; Benchmarks</a> - Learn Go testing: table-driven tests, mocking, benchmarks, and the race detector.</li>
        </ul>

        <h2>Database</h2>
        <ul>
          <li><a href="/lesson/database-access-sql">Database Access &amp; SQL</a> - Learn Go database access: database/sql, transactions, pgx, and the repository pattern.</li>
        </ul>

        <h2>Advanced Patterns</h2>
        <ul>
          <li><a href="/lesson/design-patterns">Design Patterns in Go</a> - Implement dependency injection, builder, strategy, observer, and circuit breaker patterns.</li>
          <li><a href="/lesson/reflection-code-generation">Reflection &amp; Code Generation</a> - Understand Go reflection, go:generate, and go:embed.</li>
          <li><a href="/lesson/performance-profiling">Performance &amp; Profiling</a> - Master pprof profiling, memory optimization, sync.Pool, and escape analysis.</li>
        </ul>

        <h2>Production</h2>
        <ul>
          <li><a href="/lesson/logging-observability">Logging &amp; Observability</a> - Learn production logging with slog, Prometheus metrics, and health checks.</li>
          <li><a href="/lesson/configuration-deployment">Configuration &amp; Deployment</a> - Deploy Go applications with Docker, Makefiles, and cross-compilation.</li>
          <li><a href="/lesson/building-complete-rest-api">Building a Complete REST API</a> - Build a production-grade Go REST API with 3-layer architecture.</li>
        </ul>
